<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>FreshGround Parts Reference</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #1a1a18;
    --surface: #242422;
    --surface2: #2e2e2b;
    --border: #3a3a36;
    --beige: #d4c5a0;
    --teal: #5b9e9a;
    --teal-dim: #3d6e6b;
    --text: #e8e0d0;
    --muted: #8a8478;
    --hot: #e07840;
    --warm: #c4a060;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overscroll-behavior: none;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    height: 100vh;
  }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: calc(12px + var(--safe-top)) 16px 12px;
    flex-shrink: 0;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .header-top h1 {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: var(--beige);
  }

  .header-stats { display: flex; gap: 16px; }
  .stat { text-align: right; }
  .stat-val { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--teal); line-height: 1; }
  .stat-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

  /* SEARCH ROW */
  .search-row { display: flex; gap: 8px; margin-bottom: 8px; }

  .search-wrap { position: relative; flex: 1; }
  .search-wrap svg {
    position: absolute; left: 10px; top: 50%;
    transform: translateY(-50%); color: var(--muted); pointer-events: none;
  }

  input[type=search] {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 15px; padding: 10px 10px 10px 32px; outline: none; -webkit-appearance: none;
  }
  input[type=search]:focus { border-color: var(--teal-dim); }
  input[type=search]::placeholder { color: var(--muted); }

  .filter-btn {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--muted); padding: 10px 12px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-family: 'DM Sans', sans-serif; white-space: nowrap; flex-shrink: 0;
  }
  .filter-btn.active { border-color: var(--teal-dim); color: var(--teal); }

  /* SORT CHIPS */
  .sort-row {
    display: flex; gap: 6px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px;
  }
  .sort-row::-webkit-scrollbar { display: none; }

  .chip {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 20px;
    color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 12px;
    padding: 5px 12px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: border-color 0.15s, color 0.15s;
  }
  .chip.active { border-color: var(--teal-dim); color: var(--teal); background: rgba(61,110,107,0.15); }

  /* RESULTS BAR */
  .results-bar {
    padding: 6px 16px; font-size: 11px; color: var(--muted);
    flex-shrink: 0; border-bottom: 1px solid var(--border);
  }

  /* SCROLL AREA */
  .scroll-area {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    padding: 12px 12px calc(12px + var(--safe-bottom));
    display: flex; flex-direction: column; gap: 10px;
  }

  /* SUPPLIER BLOCKS */
  .supplier-block {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
  }

  .supplier-header {
    display: flex; align-items: center; gap: 10px; padding: 13px 14px;
    cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .supplier-header:active { background: var(--surface2); }

  .supplier-header-inner {
    flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;
  }

  .supplier-name {
    font-family: 'Playfair Display', serif; font-size: 15px;
    color: var(--beige); min-width: 0;
  }

  .sup-badges { display: flex; gap: 6px; flex-wrap: wrap; }

  .sup-badge {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 4px; font-size: 10px; color: var(--muted); padding: 2px 6px; white-space: nowrap;
  }
  .sup-badge b { color: var(--teal); font-weight: 600; }

  .chevron { color: var(--muted); transition: transform 0.2s; flex-shrink: 0; }
  .supplier-block.open .chevron { transform: rotate(180deg); }

  /* MOBILE CARDS — always used on mobile */
  .parts-cards { display: none; }
  .supplier-block.open .parts-cards { display: block; }

  .part-card {
    border-top: 1px solid var(--border);
    padding: 11px 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 12px;
  }
  .part-card:active { background: var(--surface2); }

  .part-code {
    font-weight: 600; color: var(--teal); font-size: 12px;
    letter-spacing: 0.04em; grid-column: 1; grid-row: 1;
  }
  .part-name {
    color: var(--text); font-size: 13px; line-height: 1.35;
    grid-column: 1; grid-row: 2;
  }
  .part-meta {
    grid-column: 2; grid-row: 1 / 3;
    display: flex; flex-direction: column;
    align-items: flex-end; justify-content: center; gap: 4px;
  }
  .part-price { color: var(--beige); font-weight: 600; font-size: 13px; white-space: nowrap; }
  .part-price.na { color: var(--muted); font-size: 11px; font-weight: 400; }
  .part-uses { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .use-dot {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--teal-dim); margin-right: 3px;
    vertical-align: middle; position: relative; top: -1px;
  }
  .use-dot.hot { background: var(--hot); }
  .use-dot.warm { background: var(--warm); }

  /* DESKTOP TABLE — hidden on mobile, shown on desktop */
  .parts-table-wrap { display: none !important; }

  @media (min-width: 640px) {
    .header { padding: 20px 32px; }
    .header-top h1 { font-size: 22px; }
    .scroll-area { padding: 20px 24px; gap: 14px; }
    .supplier-name { font-size: 16px; }

    /* On desktop, hide cards and show table */
    .supplier-block.open .parts-cards { display: none; }
    .supplier-block.open .parts-table-wrap { display: block !important; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead tr { background: var(--surface2); }
    th {
      text-align: left; font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
      padding: 10px 16px; border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    th.num { text-align: right; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.08s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    td { padding: 10px 16px; vertical-align: middle; }
    td.item-code { font-weight: 600; color: var(--teal); letter-spacing: 0.04em; white-space: nowrap; font-size: 12px; }
    td.num { text-align: right; white-space: nowrap; }
    .bar-wrap {
      display: inline-block; width: 50px; height: 5px; background: var(--border);
      border-radius: 3px; vertical-align: middle; margin-left: 6px; position: relative; top: -1px;
    }
    .bar-fill { height: 100%; border-radius: 3px; background: var(--teal-dim); }
    .bar-fill.hot { background: var(--hot); }
    .bar-fill.warm { background: var(--warm); }
  }

  /* FILTER SHEET */
  .sheet-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 100;
  }
  .sheet-overlay.open { display: block; }

  .sheet {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-radius: 16px 16px 0 0;
    padding: 0 0 calc(16px + var(--safe-bottom));
    z-index: 101; transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
    max-height: 80dvh; max-height: 80vh;
    display: flex; flex-direction: column;
  }
  .sheet.open { transform: translateY(0); }

  .sheet-handle {
    width: 36px; height: 4px; background: var(--border);
    border-radius: 2px; margin: 10px auto 0; flex-shrink: 0;
  }
  .sheet-title {
    font-family: 'Playfair Display', serif; font-size: 16px; color: var(--beige);
    padding: 14px 20px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .sheet-list { overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; }

  .sheet-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    cursor: pointer; font-size: 14px; color: var(--text);
  }
  .sheet-item:active { background: var(--surface2); }
  .sheet-item:last-child { border-bottom: none; }
  .sheet-item.selected { color: var(--teal); }
  .sheet-item .check { color: var(--teal); opacity: 0; }
  .sheet-item.selected .check { opacity: 1; }
  .sheet-item-count { font-size: 12px; color: var(--muted); }

  .no-results { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 14px; }

  mark { background: rgba(91,158,154,0.25); color: var(--teal); border-radius: 2px; padding: 0 1px; }
</style>
</head>

      <span>${esc(label)}</span>
      <span style="display:flex;align-items:center;gap:8px">
        <span class="sheet-item-count">${count.toLocaleString()} uses</span>
        <svg class="check" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="4 10 8 14 16 6"/></svg>
      </span>
    </div>`).join('');
}
function selectSupplier(val) {
  currentSupplier = val;
  document.getElementById('filterBtn').classList.toggle('active', val !== '');
  closeSheet();
  render();
}

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function highlight(text, q) {
  if (!q) return esc(text);
  return esc(text).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`);
}
const dotClass = c => { const p=c/maxCount; return p>0.4?'hot':p>0.15?'warm':''; };
const barClass = dotClass;
const fmtMobile = cost => cost!=null ? `£${cost.toFixed(2)}` : '—';
const fmtDesktop = cost => cost!=null ? `<span style="color:var(--beige);font-weight:600">£${cost.toFixed(2)}</span>` : '<span style="color:var(--muted);font-size:11px">—</span>';

function render() {
  const q = currentSearch.toLowerCase().trim();
  const content = document.getElementById('mainContent');

  let filtered = allParts.filter(p =>
    (!currentSupplier || p.supplier === currentSupplier) &&
    (!q || p.item.toLowerCase().includes(q) || p.memo.toLowerCase().includes(q))
  );

  if (currentSort==='count') filtered.sort((a,b)=>b.count-a.count);
  else if (currentSort==='cost') filtered.sort((a,b)=>(b.cost??-1)-(a.cost??-1));
  else filtered.sort((a,b)=>a.memo.localeCompare(b.memo));

  document.getElementById('resultsBar').textContent =
    `${filtered.length.toLocaleString()} part${filtered.length!==1?'s':''}${currentSupplier?' · '+currentSupplier:''}`;

  if (!filtered.length) {
    content.innerHTML = '<div class="no-results">No parts match your search.</div>';
    return;
  }

  const bySupplier = {};
  for (const p of filtered) { (bySupplier[p.supplier]=bySupplier[p.supplier]||[]).push(p); }

  const suppliersOrdered = Object.entries(bySupplier)
    .sort((a,b)=>b[1].reduce((s,p)=>s+p.count,0)-a[1].reduce((s,p)=>s+p.count,0));

  const autoOpen = Object.keys(bySupplier).length<=2 || q || currentSupplier;

  content.innerHTML = suppliersOrdered.map(([supplier, parts]) => {
    const totalUses = parts.reduce((s,p)=>s+p.count,0);
    const totalSpend = parts.filter(p=>p.cost).reduce((s,p)=>s+p.cost*p.count,0);
    const isOpen = autoOpen ? 'open' : '';

    const cards = parts.map(p=>`
      <div class="part-card">
        <div class="part-code">${highlight(p.item,q)}</div>
        <div class="part-name">${highlight(p.memo,q)}</div>
        <div class="part-meta">
          <div class="part-price ${p.cost==null?'na':''}">${fmtMobile(p.cost)}</div>
          <div class="part-uses"><span class="use-dot ${dotClass(p.count)}"></span>${p.count}x</div>
        </div>
      </div>`).join('');

    const rows = parts.map(p=>`
      <tr>
        <td class="item-code">${highlight(p.item,q)}</td>
        <td>${highlight(p.memo,q)}</td>
        <td class="num">${fmtDesktop(p.cost)}</td>
        <td class="num">
          <span style="font-weight:600">${p.count.toLocaleString()}</span>
          <span class="bar-wrap"><span class="bar-fill ${barClass(p.count)}" style="width:${Math.round(p.count/maxCount*100)}%"></span></span>
        </td>
      </tr>`).join('');

    return `<div class="supplier-block ${isOpen}">
      <div class="supplier-header" onclick="toggleBlock(this.parentElement)">
        <div class="supplier-header-inner">
          <div class="supplier-name">${esc(supplier)}</div>
          <div class="sup-badges">
            <span class="sup-badge"><b>${parts.length}</b> parts</span>
            <span class="sup-badge"><b>${totalUses.toLocaleString()}</b> uses</span>
            ${totalSpend>0?`<span class="sup-badge">est. <b>£${Math.round(totalSpend).toLocaleString()}</b></span>`:''}
          </div>
        </div>
        <svg class="chevron" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 8 10 13 15 8"/></svg>
      </div>
      <div class="parts-cards">${cards}</div>
      <div class="parts-table-wrap">
        <table>
          <thead><tr>
            <th style="width:110px">Item code</th>
            <th>Part name / description</th>
            <th class="num" style="width:110px">List price</th>
            <th class="num" style="width:160px">Uses (12m)</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');
}

function toggleBlock(el) { el.classList.toggle('open'); }

document.getElementById('searchInput').addEventListener('input', e=>{ currentSearch=e.target.value; render(); });
document.querySelectorAll('.chip').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentSort=btn.dataset.sort;
    render();
  });
});

render();
</script>
</body>
</html>
